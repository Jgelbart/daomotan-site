const HUE_NAMES=Object.keys(HUES);

const toBool=v=>v===true||v===1||v==='1'||v==='true'||v==='on';
function applyFX(o,persist=true){if(!o||typeof o!=='object')return;
  for(const k of Object.keys(FXS))if(k in o){const v=o[k];
    if(k==='hue'){const n=String(v).toLowerCase();if(HUES[n])FXS.hue=n;else if(/^#?[0-9a-f]{6}$/i.test(n)){FXS.hue='custom';HUES.custom=n[0]==='#'?n:'#'+n;}}

    else{const x=+v;if(isFinite(x))FXS[k]=Math.max(0,Math.min(100,x));}}
  if(persist)try{localStorage.setItem('b9fx',JSON.stringify(FXS));}catch(e){}
  refreshHue();}
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
let RGB=[57,255,136];
const C={};const A=a=>`rgba(${RGB.join(',')},${a})`;

  Object.assign(C,{ink:A(1),ship:A(1),lander:A(1),mutant:A(1),ground:A(1),rim:A(1),dim:A(.5),faint:A(.22),beam:A(.14)});}

{const q={};new URLSearchParams(location.search).forEach((v,k)=>q[k]=v);applyFX(q,false);}

let AC=null,noiseBuf=null,MASTER=null,T0=0,ENG=null,FX=null,whiteBuf=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();{const hc=AC.createBiquadFilter();hc.type='lowpass';hc.frequency.value=7000;hc.Q.value=.5;const lim=AC.createDynamicsCompressor();lim.threshold.value=-14;lim.knee.value=10;lim.ratio.value=6;lim.attack.value=.004;lim.release.value=.2;const mg=AC.createGain();B9VOL.trim(mg,.5);/* .5 at VOLUME 10: .9 clipped NAN II's speaker bar (see gameplay.py) */hc.connect(lim);lim.connect(mg);mg.connect(AC.destination);MASTER=hc;}T0=AC.currentTime;setupEngine();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}

  ENG.L5.o.frequency.setTargetAtTime(f*1.5,t,.3);ENG.R5.o.frequency.setTargetAtTime(f*1.5+bt,t,.3);
  ENG.L5.g.gain.setTargetAtTime(.32*thrust,t,.2);ENG.R5.g.gain.setTargetAtTime(.32*thrust,t,.2);

addEventListener('keydown',e=>{keys[e.code]=true;audio();if(e.code==='KeyM'&&!e.repeat)B9MUS.toggle();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});

const prev={};
function readInput(){let x=0,y=0,jump=!!(keys.Space||keys.KeyZ),fire=!!(keys.KeyJ||keys.KeyX),start=!!(keys.Enter||keys.KeyP),color=!!keys.KeyC,egg=!!(keys.KeyQ||keys.Tab),lay=!!keys.KeyT,up=!!(keys.ArrowUp||keys.KeyW),padA=false,back=!!keys.Escape;
  if(keys.ArrowLeft||keys.KeyA)x-=1;if(keys.ArrowRight||keys.KeyD)x+=1;if(up)y-=1;if(keys.ArrowDown||keys.KeyS)y+=1;
  for(const p of (navigator.getGamepads?navigator.getGamepads():[])){if(!p)continue;padSeen=true;const b=i=>p.buttons[i]&&(p.buttons[i].pressed||p.buttons[i].value>.5);
    const ax=p.axes[0]||0,ay=p.axes[1]||0;if(Math.abs(ax)>.3)x+=Math.sign(ax);if(ay<-.4)y-=1;if(ay>.4)y+=1;
    if(b(14))x-=1;if(b(15))x+=1;if(b(12)){y-=1;up=true;}if(b(13))y+=1;if(b(0)){jump=true;padA=true;}if(b(1)||b(4))lay=true;if(b(3))egg=true;if(b(2)||b(5))fire=true;if(b(1))back=true;if(b(9))start=true;if(b(8))color=true;if(b(0)||b(9))audio();}
  x=clamp(x,-1,1);y=clamp(y,-1,1);
  const r={x,y,up,jump,padA,fire,start,color,backP:back&&!prev.back,eggP:egg&&!prev.egg,layP:lay&&!prev.lay,jumpP:jump&&!prev.jump,fireP:fire&&!prev.fire,startP:start&&!prev.start,colorP:color&&!prev.color,upP:y<-.5&&!(prev.y<-.5),downP:y>.5&&!(prev.y>.5),leftP:x<0&&!(prev.x<0),rightP:x>0&&!(prev.x>0)};
  Object.assign(prev,{jump,fire,start,color,egg,lay,x,y,back});return r;}

/* EXIT GAME, from the pause menu: back to NAN II's media library, on the Games
   tab. Inside NAN II's face the game is a page in the face's frame and NAN II's own
   screen state is the truth, so the face server is asked to change it -- the
   same /api/screen the shelf's game cards use to open a game. Opened on its
   own anywhere else, the page just goes there itself. */
let exiting=false;
function exitGame(){if(exiting)return;exiting=true;const url='../';
  let inB9=false;try{inB9=window.parent!==window&&!!parent.document.getElementById('dock');}catch(e){}
  if(!inB9){location.href=url;return;}
  fetch('/api/screen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src:url})})
    .then(r=>{if(!r.ok)throw 0;}).catch(()=>{location.href=url;});}
/* THE PAUSE MENU: up and down to choose, A, space or fire to take it. */
const PAUSE_MENU=['RESUME','VOLUME','MUSIC','MANUAL','QUIT TO THE MENU','EXIT GAME'];
function pauseInput(inp){if(inp.backP){G.state='play';return;}/* B goes back */const n=PAUSE_MENU.length;G.pm=G.pm||0;if(inp.upP)G.pm=(G.pm+n-1)%n;if(inp.downP)G.pm=(G.pm+1)%n;
  const m=PAUSE_MENU[G.pm],d=(inp.rightP?1:0)-(inp.leftP?1:0);if(d&&(m==='VOLUME'||m==='MUSIC')){if(m==='VOLUME')B9VOL.set(B9VOL.level+d);else B9MUS.setLevel(B9MUS.level+d);tone(700,700,.05,'square',.03);}
  if(inp.jumpP||inp.fireP){if(m==='RESUME')G.state='play';else if(m==='MUSIC')B9MUS.toggle();else if(m==='MANUAL')manOpen();else if(m==='QUIT TO THE MENU')G=null;else if(m==='EXIT GAME')exitGame();}}

/* ---------------- shared fx ---------------- */
function burst(x,y,n,spd=240,col){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(30,spd);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,1),col:col||C.ink});}}
function say(t,d=2.2,sub=''){G.msg=t;G.sub=sub;G.msgT=d;}
function pop(x,y,txtS){G.pops.push({x,y,t:1.2,txt:txtS});}
function addScore(v,x,y){G.score+=v;if(x!==undefined)pop(x,y,String(v));if(G.score>=G.nextLife){G.lives++;G.nextLife+=15000;say('EXTRA NAN II',1.4);tone(523,1046,.4,'triangle',.06);}}
function kaboom(x,y,big){burst(x,y,big?30:16);G.rings.push({x,y,t:0});G.shake=Math.max(G.shake,big?8:4);G.hitStop=Math.max(G.hitStop,.04);
  if(AC){noiseHit(0,0,big?.28:.2,big?.6:.4,rnd(3500,5500),110);thump(0,0,.28,rnd(120,160),40,.3);chirp(0,0,.04,rnd(700,950),120,.16);}}
function sndJump(){if(AC)chirp(0,0,.035,280,720,.12,'square');}
function sndStomp(){if(AC){thump(0,0,.3,180,50,.2);chirp(0,0,.04,900,200,.15,'square');}}
function sndHurt(){if(AC){noiseHit(0,0,.25,.5,4000,100);chirp(0,0,.05,700,90,.4,'sawtooth');}}

/* ---------------- black hole ---------------- */
function drawHole(x,y,r,a=1){ctx.save();ctx.translate(x,y);ctx.globalAlpha=a;ctx.strokeStyle=C.ink;ctx.lineCap='round';
  for(let k=0;k<5;k++){ctx.lineWidth=2.5-k*.3;ctx.beginPath();for(let s=0;s<=40;s++){const u=s/40,ang=-T*2.2+k*TAU/5+u*4.2,rr=r*(1.9-1.4*u);s?ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr*.8):ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr*.8);}ctx.globalAlpha=a*(.35+k*.12);ctx.stroke();}
  ctx.globalAlpha=a;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,r*.55,r*.44,0,0,TAU);ctx.stroke();
  ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.ellipse(0,0,r*.5,r*.4,0,0,TAU);ctx.fill();ctx.restore();
  for(let i=0;i<14;i++){const ang=T*3+i*1.7,rr=r*(.6+((T*.7+i*.37)%1)*1.4);ctx.fillStyle=C.ink;ctx.globalAlpha=a*.7;ctx.fillRect(Math.cos(ang)*rr,Math.sin(ang)*rr*.8,2,2);}
  ctx.restore();}

/* ---------------- the Smart Appliances ---------------- */
function drawVac(x,y,dir){ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-6,15,6,0,0,TAU);ctx.stroke();
  ctx.fillRect(x-12,y-2,24,2);ctx.beginPath();ctx.arc(x+dir*6,y-8,2,0,TAU);ctx.fill();const b=Math.sin(T*20)*2;ctx.fillRect(x-dir*16,y-1,3,2+b);}
function drawToaster(x,y,pop){ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect?ctx.roundRect(x-14,y-20,28,20,4):ctx.rect(x-14,y-20,28,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-8,y-20);ctx.lineTo(x-8,y-24-pop*6);ctx.moveTo(x+4,y-20);ctx.lineTo(x+4,y-24-pop*6);ctx.stroke();
  ctx.fillStyle=C.ink;ctx.fillRect(x+10,y-12,5,3);ctx.fillRect(x-8,y-10,2,2);ctx.fillRect(x-3,y-10,2,2);}
function drawSpeaker(x,y){ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-24,9,3,0,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-9,y-24);ctx.lineTo(x-9,y-2);ctx.moveTo(x+9,y-24);ctx.lineTo(x+9,y-2);ctx.stroke();ctx.beginPath();ctx.ellipse(x,y-2,9,3,0,0,Math.PI);ctx.stroke();
  const glowOn=Math.floor(T*3)%2;if(glowOn){ctx.beginPath();ctx.ellipse(x,y-24,6,1.5,0,0,TAU);ctx.fill();}for(let k=0;k<3;k++)ctx.fillRect(x-5+k*4,y-14,2,2);}
function drawToast(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,6);ctx.lineTo(-6,-2);ctx.quadraticCurveTo(-7,-8,0,-8);ctx.quadraticCurveTo(7,-8,6,-2);ctx.lineTo(6,6);ctx.closePath();ctx.stroke();ctx.restore();}
function drawBolt(x,y){ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=6;i++){const a=i/6*TAU+T*2;i?ctx.lineTo(x+Math.cos(a)*6,y+Math.sin(a)*6):ctx.moveTo(x+Math.cos(a)*6,y+Math.sin(a)*6);}ctx.stroke();ctx.fillStyle=C.ink;ctx.fillRect(x-1.5,y-1.5,3,3);}
function drawCrate(r){ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2);ctx.globalAlpha=.4;ctx.beginPath();ctx.moveTo(r.x+4,r.y+4);ctx.lineTo(r.x+r.w-4,r.y+r.h-4);ctx.moveTo(r.x+r.w-4,r.y+4);ctx.lineTo(r.x+4,r.y+r.h-4);ctx.stroke();ctx.globalAlpha=1;}
/* drifting junk for the asteroid zone: fridge, washer, toaster, nut */
function drawJunk(j,x,y){ctx.save();ctx.translate(x,y);ctx.rotate(j.a);ctx.strokeStyle=C.ink;ctx.lineWidth=2;const r=j.r;
  if(j.kind===0){ctx.strokeRect(-r*.6,-r,r*1.2,r*2);ctx.beginPath();ctx.moveTo(-r*.6,-r*.3);ctx.lineTo(r*.6,-r*.3);ctx.moveTo(r*.4,-r*.8);ctx.lineTo(r*.4,-r*.5);ctx.moveTo(r*.4,-r*.1);ctx.lineTo(r*.4,r*.3);ctx.stroke();}
  else if(j.kind===1){ctx.strokeRect(-r*.8,-r*.8,r*1.6,r*1.6);ctx.beginPath();ctx.arc(0,r*.1,r*.45,0,TAU);ctx.stroke();ctx.fillStyle=C.ink;ctx.fillRect(-r*.6,-r*.65,r*.3,r*.12);}
  else if(j.kind===2){ctx.strokeRect(-r,-r*.6,r*2,r*1.2);ctx.beginPath();ctx.moveTo(-r*.4,-r*.6);ctx.lineTo(-r*.4,-r*.9);ctx.moveTo(r*.3,-r*.6);ctx.lineTo(r*.3,-r*.9);ctx.stroke();}
  else{ctx.beginPath();for(let i=0;i<=6;i++){const a=i/6*TAU;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(r,0);}ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.4,0,TAU);ctx.stroke();}
  ctx.restore();}

/* =================== ZONE 1: JUNKYARD (platformer) =================== */
const JUNK={
  name:'THE JUNKYARD',hint:'DRIVE  LEFT RIGHT   A JUMP   HOLD A BOOST   X FIRE   B EGG',
  init(){const lv=G.loop,Z={solids:[],enemies:[],bolts:[],toasts:[],waves:[],camX:0};let x=0,gy=440;
    const ground=(w)=>{Z.solids.push({x,y:gy,w,h:H-gy+200,ground:1});const x0=x;x+=w;return x0;};
    ground(700);Z.start={x:120,y:gy};
    const len=5600+lv*900;
    while(x<len){const r=Math.random();
      if(r<.22){x+=rnd(90,130+lv*12);}                                             /* pit */
      else if(r<.4){gy=clamp(gy+(Math.random()<.5?-1:1)*rnd(30,55),330,470);ground(rnd(240,400));}   /* step */
      else if(r<.55){const x0=ground(rnd(320,460));const n=1+Math.floor(Math.random()*2);for(let k=0;k<n;k++)Z.solids.push({x:x0+140+k*44,y:gy-40,w:40,h:40});
        if(Math.random()<.6)Z.solids.push({x:x0+140,y:gy-80,w:40,h:40});Z.bolts.push({x:x0+160,y:gy-110});}
      else if(r<.7){const x0=ground(rnd(360,480));const py=gy-rnd(110,150);Z.solids.push({x:x0+100,y:py,w:150,h:18,plat:1});for(let k=0;k<3;k++)Z.bolts.push({x:x0+125+k*50,y:py-26});
        if(Math.random()<.5)Z.enemies.push({k:'speaker',x:x0+260,y:py-60,y0:py-60,cd:rnd(1,3),alive:1});}
      else{const x0=ground(rnd(380,520));const t=Math.random();
        if(t<.5)Z.enemies.push({k:'vac',x:x0+rnd(120,260),y:gy,vx:-(50+lv*12),alive:1,min:x0+10,max:x});
        else if(t<.8)Z.enemies.push({k:'toaster',x:x0+rnd(160,300),y:gy,cd:rnd(1,2.5),alive:1,pop:0});
        else Z.enemies.push({k:'speaker',x:x0+rnd(160,300),y:gy-120,y0:gy-120,cd:rnd(1,3),alive:1});
        for(let k=0;k<3;k++)Z.bolts.push({x:x0+60+k*30,y:gy-24});}}
    ground(900);Z.hole={x:x+300-900+320,y:gy-90};Z.end=x;
    const p=G.p={x:Z.start.x,y:Z.start.y,vx:0,vy:0,dir:1,onG:false,fuel:1,coyote:0,buf:0,inv:1.5,thrust:false,lift:0,tilt:0};Z.safe={x:p.x,y:p.y};return Z;},
  hitRect(p){return {x:p.x-13,y:p.y-30,w:26,h:30};},
  update(dt,inp){const Z=G.Z,p=G.p,lv=G.loop;
    /* driving */
    const acc=p.onG?1300:650;p.thrust=inp.x!==0;if(inp.x){p.dir=inp.x;p.vx+=inp.x*acc*dt;}else p.vx-=p.vx*(p.onG?3.2:.4)*dt;
    p.vx=clamp(p.vx,-290,290);
    /* jumping, coyote time and buffered presses */
    p.coyote=p.onG?.09:p.coyote-dt;p.buf=inp.jumpP?.12:p.buf-dt;
    if(p.buf>0&&p.coyote>0){p.vy=-560;p.onG=false;p.coyote=0;p.buf=0;sndJump();}
    /* boosting: hold jump in the air to fire the foot jets */
    /* THE FLOAT (see gameplay.py): the jets ease him up, dreamy, and hover him near the top */
    p.lift=0;if(!p.onG&&inp.jump&&p.fuel>0&&p.coyote<=0&&!inp.jumpP&&p.vy>-130){const want=p.y<HUD+90?0:-130;p.vy+=(want-p.vy)*Math.min(1,2.6*dt);p.fuel=Math.max(0,p.fuel-dt*.48);p.lift=1;}
    if(p.onG)p.fuel=Math.min(1,p.fuel+dt*1.1);
    if(!inp.jump&&p.vy<-200&&!p.lift)p.vy+=1400*dt;  /* short hop if you let go early */
    const glide=inp.jump&&!p.onG&&p.vy>0;   /* gauge empty, A still held: a slow glide down */
    if(!p.lift)p.vy+=(glide?700:1500)*dt;p.vy=Math.min(p.vy,glide?300:900);
    /* move and collide, one axis at a time */
    p.x+=p.vx*dt;let r=this.hitRect(p);
    for(const s of Z.solids){if(s.plat)continue;if(r.x<s.x+s.w&&r.x+r.w>s.x&&r.y<s.y+s.h&&r.y+r.h>s.y+1){if(p.vx>0)p.x=s.x-13.01;else if(p.vx<0)p.x=s.x+s.w+13.01;p.vx=0;r=this.hitRect(p);}}
    p.x=Math.max(20,p.x);
    const py0=p.y;p.y+=p.vy*dt;r=this.hitRect(p);const was=p.onG;p.onG=false;
    for(const s of Z.solids){if(r.x<s.x+s.w&&r.x+r.w>s.x&&r.y<s.y+s.h&&r.y+r.h>s.y){
      if(p.vy>=0&&py0<=s.y+2){p.y=s.y;p.vy=0;p.onG=true;}
      else if(!s.plat&&p.vy<0&&py0-30>=s.y+s.h-2){p.y=s.y+s.h+30;p.vy=0;}
      r=this.hitRect(p);}}
    if(p.onG&&!was&&py0<p.y){G.shake=Math.max(G.shake,1.5);for(let k=0;k<6;k++)G.dust.push({x:p.x+rnd(-12,12),y:p.y-2,vx:rnd(-90,90),vy:-rnd(10,50),life:rnd(.3,.6),max:.6});}
    if(p.onG&&Math.abs(p.vx)>80&&Math.random()<dt*25)G.dust.push({x:p.x-p.dir*10,y:p.y-2,vx:-p.dir*rnd(30,80),vy:-rnd(10,40),life:.5,max:.5});
    if(p.onG){const under=Z.solids.some(s=>s.ground&&p.x-14>=s.x&&p.x+14<=s.x+s.w&&Math.abs(s.y-p.y)<2);if(under)Z.safe={x:p.x,y:p.y};}
    if(p.y>H+80){hurt(true);return;}
    p.tilt=clamp(-p.vy/900,-.25,.25)*p.dir;
    /* camera */
    const tx=p.x-W*.35+p.dir*60;Z.camX+=(tx-Z.camX)*Math.min(1,3*dt);Z.camX=Math.max(0,Z.camX);
    /* enemies */
    for(const e of Z.enemies){if(!e.alive)continue;
      if(e.k==='vac'){e.x+=e.vx*dt;if(e.x<e.min+14||e.x>e.max-14){e.vx*=-1;e.x=clamp(e.x,e.min+14,e.max-14);}
        if(Math.random()<dt*.15)pop(e.x,e.y-26,'CLEANING!');}
      else if(e.k==='toaster'){e.pop=Math.max(0,e.pop-dt*3);e.cd-=dt;if(e.cd<=0&&Math.abs(e.x-p.x)<560){e.cd=rnd(2,3)-lv*.15;e.pop=1;
          Z.toasts.push({x:e.x,y:e.y-26,vx:clamp((p.x-e.x)*.8,-180,180),vy:-rnd(420,520),a:0,life:4});if(AC){tone(1200,1600,.08,'triangle',.04);}pop(e.x,e.y-40,'DING!');}}
      else{e.y=e.y0+Math.sin(T*2+e.x)*16;e.cd-=dt;if(e.cd<=0&&Math.abs(e.x-p.x)<520){e.cd=rnd(2.6,3.6)-lv*.15;Z.waves.push({x:e.x,y:e.y-13,vx:Math.sign(p.x-e.x)*170,life:3});
          if(AC)chirp(0,0,.03,500,900,.25,'sine');if(Math.random()<.4)pop(e.x,e.y-40,"SORRY, I DIDN'T CATCH THAT");}}
      const eh=e.k==='vac'?12:e.k==='toaster'?20:28,er={x:e.x-14,y:e.y-eh,w:28,h:eh};r=this.hitRect(p);
      if(r.x<er.x+er.w&&r.x+r.w>er.x&&r.y<er.y+er.h&&r.y+r.h>er.y){
        if(p.vy>0&&p.y-er.y<16){e.alive=0;kaboom(e.x,e.y-eh/2);sndStomp();addScore(200,e.x,e.y-eh-10);p.vy=inp.jump?-560:-400;}
        else if(p.inv<=0)hurt(false);}}
    for(const t of Z.toasts){t.vy+=900*dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.a+=dt*8;t.life-=dt;
      if(p.inv<=0&&Math.abs(t.x-p.x)<14&&Math.abs(t.y-(p.y-15))<18){t.life=0;hurt(false);}}
    Z.toasts=Z.toasts.filter(t=>t.life>0&&t.y<H+50);
    for(const w of Z.waves){w.x+=w.vx*dt;w.life-=dt;if(p.inv<=0&&Math.abs(w.x-p.x)<14&&Math.abs(w.y-(p.y-15))<16){w.life=0;hurt(false);}}
    Z.waves=Z.waves.filter(w=>w.life>0);
    /* NAN II's KIT: X fires a laser the way he faces, B lays a timer egg at his feet */
    kitInput(Z,inp,dt,p.x+p.dir*20,p.y-10,p.dir*720+p.vx,p.x,p.y-14,p.vx*.4,-120);
    for(const l of Z.lasers){l.x+=l.vx*dt;l.life-=dt;
      if(Z.solids.some(s=>!s.plat&&l.x>s.x&&l.x<s.x+s.w&&l.y>s.y&&l.y<s.y+s.h)){l.life=0;burst(l.x,l.y,4,80);continue;}
      for(const e of Z.enemies){if(!e.alive)continue;const eh=e.k==='vac'?12:e.k==='toaster'?20:28;
        if(Math.abs(l.x-e.x)<16&&l.y>e.y-eh-6&&l.y<e.y+6){e.alive=0;l.life=0;kaboom(e.x,e.y-eh/2);addScore(150,e.x,e.y-eh-10);break;}}
      if(l.life>0)for(const t of Z.toasts)if(t.life>0&&Math.abs(t.x-l.x)<14&&Math.abs(t.y-l.y)<14){t.life=0;l.life=0;burst(t.x,t.y,6,100);addScore(25);break;}
      if(l.life>0)for(const w of Z.waves)if(w.life>0&&Math.abs(w.x-l.x)<16&&Math.abs(w.y-l.y)<16){w.life=0;l.life=0;burst(w.x,w.y,6,100);break;}}
    Z.lasers=Z.lasers.filter(l=>l.life>0);
    for(const e of Z.kegs){e.t-=dt;e.vy=Math.min(e.vy+900*dt,600);e.vx-=e.vx*2*dt;const ox=e.x,oy=e.y;e.x+=e.vx*dt;e.y+=e.vy*dt;
      for(const s of Z.solids){if(e.x<s.x||e.x>s.x+s.w)continue;
        if(oy+7<=s.y&&e.y+7>=s.y){e.y=s.y-7;e.vy=0;e.vx*=.5;}
        else if(!s.plat&&e.y+7>s.y&&e.y-7<s.y+s.h){e.x=ox;e.vx=0;}}
      if(e.y>H+60){e.gone=1;continue;}

const DRIFT={

  /* a blast chews rock (3 damage at the heart, 2 further out, 1 at the rim), destroys enemies, and shoves NAN II without hurting him */

  if(inp.layP&&Z.kegCd<=0&&Z.kegs.length<KIT.MAX_EGGS){Z.kegCd=KIT.EGG_CD;Z.kegs.push({x:ex,y:ey,vx:evx,vy:evy,t:KIT.FUSE});if(AC){pluck(110,0,0,.08,.3,'sine');chirp(0,0,.03,300,160,.08,'triangle');}}}

  for(const l of Z.lasers){const x=l.x-cx,d=Math.sign(l.vx);ctx.beginPath();ctx.moveTo(x,l.y);ctx.lineTo(x-d*24,l.y);ctx.stroke();}

function gateHole(g,a,b){(g.holes=g.holes||[]).push([a,b]);}
function gateOpen(g,a,b){return (g.holes||[]).some(h=>h[0]<=a&&h[1]>=b);}

  ctx.textAlign='center';ctx.fillStyle=C.dim;ctx.font='13px x';txt(MAN.page<MAN_PAGES.length-1?'LEFT RIGHT TURN THE PAGE     A NEXT     B CLOSE':'LEFT GOES BACK     A OR B CLOSE',W/2,H-20);ctx.restore();}
const MAN_PAGES=[
 {t:'NAN II THROUGH THE BLACK HOLE',r:['The smart appliances have taken over the other side.','Each world ends in a black hole: fall in to reach the next. The Journey plays all three in turn, round and round, or pick one world on the title screen.','Top of the screen: your score, the world, and your B9s.']},
 {t:'THE JUNKYARD',r:[['DRIVING','NAN II drives, jumps and floats on his foot jets. The BOOST gauge refills on the ground.'],['BOLTS','25 points each'],['APPLIANCES','stomp on them or shoot them. Toasters throw toast, speakers send sound waves.'],['PITS','falling in costs a NAN II'],['THE HOLE','at the far end']]},
 {t:'THE DRIFT',r:[['THE CAVE','turn and thrust. Bumping rock hard hurts'],['ROCK','shoot it away: 3 hits, gold rock 2. Gold spills nuggets.'],['GOLD','collect enough (top left) and the hole wakes. The arrow points to it.'],['PIRATES','chase NAN II and shoot'],['JUNK','breaks into smaller junk'],['EGGS','drifter follows your path, timer ticks then bursts, seeker hunts the nearest enemy. Y switches.']]},
 {t:'THE GAUNTLET',r:[['FLYING','tap A to flutter up, hold it to float. Left and right drift.'],['GATES','fly through the gap, or blast one with a laser or an egg'],['EDGES','the top and bottom of the corridor hurt'],['ORBS','slow time, shield, shrink or an extra NAN II'],['BOLTS','25 points each']]},
 {t:'THE NAN II CONTROLLER',r:[['STICK','drive, turn or drift'],['A','jump. Hold it in the air to boost. In the Drift, thrust'],['X OR RB','fire'],['B OR LB','lay an egg'],['Y','switch eggs in the Drift'],['START','pause: volume, music and this manual'],['KEYBOARD','arrows, space jumps, J fires, T lays an egg, enter pauses']]}];
const PICKS=[['THE JOURNEY  ALL THREE',null],['THE JUNKYARD',0],['THE DRIFT',1],['THE GAUNTLET',2],['MANUAL','manual'],['EXIT GAME','exit']];let SEL=0;
function newGame(pick=SEL){G={only:PICKS[pick][1],state:'play',score:0,lives:3,nextLife:15000,loop:0,zone:0,parts:[],pops:[],rings:[],trail:[],dust:[],msg:'',sub:'',msgT:0,shake:0,hitStop:0,alarmT:0,flash:0,trans:null,Z:null,p:null,boltN:0};
  startZone(G.only??0);}
function startZone(z){G.zone=z;G.Z=ZONES[z].init();G.trail=[];G.dust=[];G.parts=[];G.rings=[];const nm=ZONES[z].name;say((G.loop?'LOOP '+(G.loop+1)+'  ':'')+nm,3.2,ZONES[z].hint);}
function enterHole(sx,sy){if(G.state!=='play')return;G.state='trans';G.trans={t:0,sx,sy,px:null};if(AC){noiseHit(0,0,.3,1.6,6000,60);tone(900,40,1.6,'sine',.08);tone(1200,60,1.6,'triangle',.04);}addScore(1000);}
function hurt(fell){if(G.state!=='play')return;const p=G.p;G.lives--;G.alarmT=1.2;G.shake=10;G.hitStop=.08;sndHurt();burst(p.x,p.y-14,24,260);
  if(G.lives<=0){G.state='over';G.overT=0;if(G.score>HIGH){HIGH=G.score;try{localStorage.setItem('b9bhHigh',HIGH);}catch(e){}}return;}
  p.inv=2;if(G.zone===0){const Z=G.Z;if(fell){p.x=Z.safe.x;p.y=Z.safe.y-2;}p.vx=-p.dir*120;p.vy=fell?0:-300;}
  else if(G.zone===1){const Z=G.Z;p.x=Z.safe.x;p.y=Z.safe.y;p.vx=p.vy=0;Z.eshots=[];}
  else{const Z=G.Z,next=Z.gates.find(g=>g.x>p.x-20);p.y=next?next.c:(H+HUD)/2;p.vy=0;p.vx=0;p.wait=.9;if(G.pw)FLAP.endPower();}}

function update(dt,inp){
  if(inp.colorP)setPhos(phos+1);
  if(MAN.open){manInput(inp.rightP||inp.jumpP||inp.fireP,inp.leftP,inp.backP||inp.startP);return;}
  if(!G){if(inp.upP){SEL=(SEL+PICKS.length-1)%PICKS.length;if(AC)chirp(0,0,.03,600,700,.05);}if(inp.downP){SEL=(SEL+1)%PICKS.length;if(AC)chirp(0,0,.03,600,700,.05);}if(inp.startP||inp.jumpP){if(PICKS[SEL][1]==='exit')exitGame();else if(PICKS[SEL][1]==='manual')manOpen();else newGame(SEL);}return;}
  if(G.state==='over'){G.overT+=dt;if(G.overT>1&&(inp.startP||inp.jumpP))G=null;return;}
  if(inp.startP&&(G.state==='play'||G.state==='paused')){G.state=G.state==='paused'?'play':'paused';G.pm=0;return;}
  if(G.state==='paused'){pauseInput(inp);return;}
  G.shake=Math.max(0,G.shake-dt*28);G.msgT-=dt;G.alarmT=Math.max(0,G.alarmT-dt);G.flash=Math.max(0,G.flash-dt*2);
  if(G.hitStop>0){G.hitStop-=dt;return;}
  if(G.state==='trans'){const tr=G.trans;tr.t+=dt;if(tr.t>1.8){G.state='play';G.flash=1;let z;if(G.only!=null){z=G.only;G.loop++;}else{z=G.zone+1;if(z>=ZONES.length){z=0;G.loop++;}}startZone(z);}return;}
  const p=G.p;p.inv=Math.max(0,(p.inv||0)-dt);
  ZONES[G.zone].update(dt,inp);
  if(AC&&G.state==='play')engine(true,p.thrust?1:0,p.lift?1:0,Math.abs(p.vx||0));
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-1.5*dt;q.vy*=1-1.5*dt;q.life-=dt;}G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.trail){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;}G.trail=G.trail.filter(q=>q.life>0);
  for(const q of G.dust){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;q.life-=dt;}G.dust=G.dust.filter(q=>q.life>0);
  for(const r of G.rings)r.t+=dt;G.rings=G.rings.filter(r=>r.t<.35);
  for(const q of G.pops){q.t-=dt;q.y-=22*dt;}G.pops=G.pops.filter(q=>q.t>0);}

/* ---------------- drawing ---------------- */
const stars=[...Array(120)].map(()=>({x:rnd(0,W),y:rnd(HUD,H),r:Math.random()<.15?2:1,b:rnd(.25,.9),d:rnd(.1,.5)}));
function draw(){ctx.clearRect(0,0,W,H);const cx=G&&G.Z?ZONES[G.zone].camX():T*30,cy=G&&G.Z&&ZONES[G.zone].camY?ZONES[G.zone].camY():0;
  for(const s of stars){const x=((s.x-cx*s.d)%W+W)%W,sy=HUD+((s.y-HUD-cy*s.d)%(H-HUD)+(H-HUD))%(H-HUD);ctx.globalAlpha=s.b*(.75+.25*Math.sin(T*2+s.x));ctx.fillStyle=C.ink;ctx.fillRect(x,sy,s.r,s.r);}ctx.globalAlpha=1;
  if(!G){titleScreen();return;}
  const wx=x=>x-cx,wy=y=>y-cy;
  if(G.state==='trans'){const tr=G.trans,u=Math.min(1,tr.t/1.6);drawHole(tr.sx,tr.sy,50+u*300,1);
    ctx.save();ctx.translate(tr.sx+(1-u)*0,tr.sy);ctx.rotate(u*18);ctx.scale(1-u*.95,1-u*.95);drawShip(0,0,1,true,1,1);ctx.restore();
    if(u>.7){ctx.fillStyle=A((u-.7)/.3);ctx.fillRect(0,0,W,H);}drawHud();return;}
  ZONES[G.zone].draw();
  for(const q of G.trail){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=C.ink;ctx.fillRect(wx(q.x)-1,wy(q.y)-1,2,2);}
  for(const q of G.dust){ctx.globalAlpha=Math.max(0,q.life/q.max)*.8;ctx.fillStyle=C.dim;ctx.fillRect(wx(q.x)-1.5,wy(q.y)-1.5,3,3);}
  for(const q of G.parts){ctx.globalAlpha=Math.max(0,Math.min(1,q.life));ctx.fillStyle=q.col;ctx.fillRect(wx(q.x),wy(q.y),2.5,2.5);}
  ctx.strokeStyle=C.ink;for(const r of G.rings){ctx.globalAlpha=1-r.t/.35;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(wx(r.x),wy(r.y),8+r.t*260,0,TAU);ctx.stroke();}
  ctx.globalAlpha=1;ctx.font='16px x';ctx.textAlign='center';for(const q of G.pops){ctx.globalAlpha=Math.min(1,q.t);ctx.fillStyle=C.ink;txt(q.txt,wx(q.x),wy(q.y));}ctx.globalAlpha=1;
  drawHud();
  if(G.msgT>0){ctx.globalAlpha=Math.min(1,G.msgT*2);ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.font='32px x';txt(G.msg,W/2,170);if(G.sub){ctx.font='16px x';ctx.fillStyle=C.dim;txt(G.sub,W/2,205);}ctx.globalAlpha=1;}
  if(G.flash>0){ctx.fillStyle=A(G.flash*.5);ctx.fillRect(0,0,W,H);}
  if(G.state==='paused')overlay('PAUSED',[...PAUSE_MENU.map(m=>m==='MUSIC'?'MUSIC '+(B9MUS.on?B9MUS.level:'OFF'):m==='VOLUME'?'VOLUME '+(B9VOL.level||'OFF'):m).map((m,i)=>i===(G.pm||0)?'>  '+m+'  <':m),'UP DOWN   LEFT RIGHT CHANGE   A SELECT   START RESUME']);
  if(G.state==='over')overlay('GAME OVER',['SCORE '+G.score+'    BEST '+HIGH,'',G.overT>1?'PRESS START FOR THE MENU':'']);}
function drawHud(){ctx.clearRect(0,0,W,HUD);ctx.fillStyle=C.rim;ctx.fillRect(0,HUD-2,W,2);ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.font='20px x';txt(G.score,20,28);
  ctx.textAlign='center';ctx.font='16px x';ctx.fillStyle=C.dim;txt(ZONES[G.zone].name+(G.loop?'  LOOP '+(G.loop+1):''),W/2,26);
  for(let i=0;i<Math.min(G.lives,6);i++){ctx.save();ctx.translate(W-30-i*34,22);drawShip(0,0,-1,false,.5,0);ctx.restore();}}
function overlay(t,lines){ctx.clearRect(0,HUD,W,H-HUD);ctx.textAlign='center';ctx.fillStyle=C.ink;ctx.font='48px x';txt(t,W/2,240);ctx.font='16px x';lines.forEach((l,i)=>txt(l,W/2,300+i*32));}
function titleScreen(){ctx.textAlign='center';ctx.fillStyle=C.ink;ctx.font='52px x';txt('NAN II THROUGH',W/2,110);txt('THE BLACK HOLE',W/2,172);
  drawHole(W/2+170,262,34);ctx.save();ctx.translate(W/2-150,262);ctx.rotate(Math.sin(T*2)*.15);drawShip(0,0,1,true,1.5,1);ctx.restore();
  drawVac(W/2-10,282,-1);drawToaster(W/2+50,282,Math.max(0,Math.sin(T*3)));drawSpeaker(W/2+100,282+Math.sin(T*2)*6);
  ctx.font='16px x';ctx.fillStyle=C.dim;txt('THE SMART APPLIANCES HAVE TAKEN OVER THE OTHER SIDE',W/2,330);
  ctx.font='20px x';PICKS.forEach(([n],i)=>{const on=i===SEL;ctx.fillStyle=on?C.ink:C.dim;txt((on?'> ':'  ')+n+(on?' <':'  '),W/2,360+i*25);});
  /* the chosen game's controls, right on the title screen */
  const pk=PICKS[SEL][1],ctl=pk==='exit'?'BACK TO THE GAMES SHELF':pk==='manual'?'WHAT YOU SEE, AND WHAT THE BUTTONS DO':pk==null?'EACH BLACK HOLE CHANGES THE GAME AND ITS CONTROLS':ZONES[pk].hint;
  ctx.font=(ctl.length>52?'13px x':'16px x');ctx.fillStyle=C.ink;txt(ctl,W/2,506);
  ctx.font='12px x';ctx.fillStyle=C.dim;txt('UP AND DOWN TO CHOOSE   START OR SPACE TO PLAY   PAUSE  ENTER   COLOR  C   MUSIC  M'+(HIGH?'   BEST '+HIGH:''),W/2,530);}

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;const inp=readInput();update(dt,inp);
  if(AC&&(!G||G.state!=='play'))engine(false,0,0,0);draw();if(MAN.open)manDraw();blit();requestAnimationFrame(frame);}
/* THE NAN II THEME on the title screen: start the sound as the page opens. NAN II's screen
   lets a page play without a tap; an ordinary browser waits for the first key. */
audio();
requestAnimationFrame(frame);

</script>
</body>
</html>
