<script>
const W=960,H=540,TOP=64,WW=4800,TAU=Math.PI*2;
const cv=document.getElementById('c'),out=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=480;buf.height=270;const ctx=buf.getContext('2d');ctx.setTransform(.5,0,0,.5,0,0);
const glow=document.createElement('canvas');glow.width=160;glow.height=90;const gctx=glow.getContext('2d');
function fit(){const bw=document.body.clientWidth,bh=document.body.clientHeight;const S=Math.min(bw/W,bh/H);const d=window.devicePixelRatio||1;
  cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.width=Math.round(W*S*d);cv.height=Math.round(H*S*d);out.setTransform(S*d,0,0,S*d,0,0);}
addEventListener('resize',fit);fit();

const FT='"Press Start 2P","Courier New",monospace',FB=FT;
/* ================= NAN II FACE SETTINGS HANDLES =================
   Every look-and-feel dial lives in FXS. NAN II's settings can drive it three ways:
   1. URL:          colony-guard.html?hue=amber&bloom=40&scanlines=1&afterglow=30
   2. postMessage:  iframe.contentWindow.postMessage({type:'b9-settings',settings:{hue:'cyan',bloom:60}},'*')
   3. JavaScript:   window.B9FX.set({flicker:0}) and window.B9FX.get()
   Changes are remembered on this device. */
const HUES={amber:'#ffb24a',orange:'#ff7a1f',bone:'#f2ecdd',green:'#39ff88',cyan:'#3fd8ff',red:'#ff4a4a'};
const HUE_NAMES=Object.keys(HUES);
const ALARM={red:'#ff3030',cyan:'#30e0ff'};
const FXS={hue:'green',bloom:40,scanlines:true,vignette:true,afterglow:30,flicker:10,breathing:false,alarmBleed:true};
const toBool=v=>v===true||v===1||v==='1'||v==='true'||v==='on';
function applyFX(o,persist=true){if(!o||typeof o!=='object')return;
  for(const k of Object.keys(FXS))if(k in o){const v=o[k];
    if(k==='hue'){const n=String(v).toLowerCase();if(HUES[n])FXS.hue=n;else if(/^#?[0-9a-f]{6}$/i.test(n)){FXS.hue='custom';HUES.custom=n[0]==='#'?n:'#'+n;}}
    else if(typeof FXS[k]==='boolean')FXS[k]=toBool(v);
    else{const x=+v;if(isFinite(x))FXS[k]=Math.max(0,Math.min(100,x));}}
  if(persist)try{localStorage.setItem('b9fx',JSON.stringify(FXS));}catch(e){}
  refreshHue();}
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
let RGB=[57,255,136];
const C={};const A=a=>`rgba(${RGB.join(',')},${a})`;
var PWHEX=null;  /* colour override while a bird power is active */
function refreshHue(hex){RGB=hexRGB(hex||PWHEX||HUES[FXS.hue]||HUES.green);
  Object.assign(C,{ink:A(1),ship:A(1),lander:A(1),mutant:A(1),ground:A(1),rim:A(1),dim:A(.5),faint:A(.22),beam:A(.14)});}
let phos=0;
function setPhos(i){phos=((i%HUE_NAMES.length)+HUE_NAMES.length)%HUE_NAMES.length;applyFX({hue:HUE_NAMES[phos]});}
try{applyFX(JSON.parse(localStorage.getItem('b9fx')||'{}'),false);}catch(e){}
{const q={};new URLSearchParams(location.search).forEach((v,k)=>q[k]=v);applyFX(q,false);}
refreshHue();phos=Math.max(0,HUE_NAMES.indexOf(FXS.hue));
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='b9-settings')applyFX(d.settings);});
window.B9FX={get:()=>({...FXS}),set:o=>applyFX(o),hues:HUE_NAMES};
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrap=x=>((x%WW)+WW)%WW;
const wd=(a,b)=>{let d=wrap(a-b);return d>WW/2?d-WW:d;};
const P1=rnd(0,TAU),P2=rnd(0,TAU),P3=rnd(0,TAU);
const groundY=x=>492+16*Math.sin(TAU*3*x/WW+P1)+11*Math.sin(TAU*8*x/WW+P2)+6*Math.sin(TAU*19*x/WW+P3);
const stars=[];for(let i=0;i<140;i++)stars.push({x:rnd(0,W),y:rnd(TOP+4,450),r:Math.random()<.15?2:1,b:rnd(.25,.9)});

const SET={fric:5,thrust:5,laser:0,mus:3};try{Object.assign(SET,JSON.parse(localStorage.getItem('colonyGuardSet')||'{}'));}catch(e){}
if(!SET.v2){SET.mus=3;SET.v2=1;}
if(!SET.v3){SET.laser=1;SET.v3=1;}  /* start everyone on the 1981 laser */
function saveSet(){try{localStorage.setItem('colonyGuardSet',JSON.stringify(SET));}catch(e){}}
let HIGH=0;try{HIGH=+localStorage.getItem('colonyGuardHigh')||0;}catch(e){}
function saveHigh(){if(G.score>HIGH){HIGH=G.score;try{localStorage.setItem('colonyGuardHigh',HIGH);}catch(e){}}}

/* ---------- sound ---------- */
let AC=null,noiseBuf=null,MASTER=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();{const hc=AC.createBiquadFilter();hc.type='lowpass';hc.frequency.value=7000;hc.Q.value=.5;const lim=AC.createDynamicsCompressor();lim.threshold.value=-14;lim.knee.value=10;lim.ratio.value=6;lim.attack.value=.004;lim.release.value=.2;const mg=AC.createGain();B9VOL.trim(mg,.5);/* .5 at VOLUME 10: .9 clipped NAN II's speaker bar (see gameplay.py) */hc.connect(lim);lim.connect(mg);mg.connect(AC.destination);MASTER=hc;}T0=AC.currentTime;setupEngine();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function noise(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);let h=0;for(let i=0;i<d.length;i++){if(i%6===0)h=Math.random()*2-1;d[i]=h;}}return noiseBuf;}
/* retro jet: stepped (crunchy) noise through a band-pass plus a low square buzz */
/* ENGINE: a warm binaural hum instead of a buzz.
   Left ear 110 Hz (the A that every scale here starts on), right ear a few Hz higher:
   on headphones the brain hears a slow, soothing pulse between them (a binaural beat).
   Thrust fades in a perfect fifth above and a soft breath of filtered brown noise; speed opens the filter. */
let ENG=null;
function brown(){const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let x=0;
  for(let i=0;i<len;i++){x=(x+.02*(Math.random()*2-1))/1.02;d[i]=x*3.5;}return b;}
function setupEngine(){const t=AC.currentTime,m=AC.createChannelMerger(2),bus=AC.createGain();bus.gain.value=0;m.connect(bus);bus.connect(MASTER);
  const mk=(f,ch,type='sine')=>{const o=AC.createOscillator();o.type=type;o.frequency.value=f;const g=AC.createGain();o.connect(g);g.connect(m,0,ch);o.start(t);return {o,g};};
  const L=mk(110,0),R=mk(116,1),L5=mk(165,0),R5=mk(171,1),sub=mk(55,0,'triangle'),subR=mk(55,1,'triangle');
  L.g.gain.value=R.g.gain.value=.5;sub.g.gain.value=subR.g.gain.value=.18;L5.g.gain.value=R5.g.gain.value=0;
  const n=AC.createBufferSource();n.buffer=brown();n.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.Q.value=.7;
  const ng=AC.createGain();ng.gain.value=0;n.connect(lp);lp.connect(ng);ng.connect(m,0,0);ng.connect(m,0,1);n.start(t);
  ENG={bus,L,R,L5,R5,lp,ng};}
function engine(on,thrust,lift,speed){if(!ENG)return;const t=AC.currentTime,k=on?1:0,s=Math.min(1,speed/560),bt=6;
  ENG.bus.gain.setTargetAtTime(k*(.05+.05*thrust+.02*lift),t,.25);
  const f=110*(1+.06*s);ENG.L.o.frequency.setTargetAtTime(f,t,.3);ENG.R.o.frequency.setTargetAtTime(f+bt,t,.3);
  ENG.L5.o.frequency.setTargetAtTime(f*1.5,t,.3);ENG.R5.o.frequency.setTargetAtTime(f*1.5+bt,t,.3);
  ENG.L5.g.gain.setTargetAtTime(.32*thrust,t,.2);ENG.R5.g.gain.setTargetAtTime(.32*thrust,t,.2);
  ENG.lp.frequency.setTargetAtTime(250+900*s+500*lift,t,.2);ENG.ng.gain.setTargetAtTime(.25*thrust+.2*lift,t,.2);}
/* ---- Atari 2600 TIA sound chip emulation: real poly counters and distortion modes ---- */
const TIA_HZ=31400;
function tiaRender(seq){const per=Math.round(TIA_HZ/60),buf=AC.createBuffer(1,seq.length*per,TIA_HZ),d=buf.getChannelData(0);
  let p4=15,p5=31,p9=511,div=0,d31=0,d3=0,out=0,i=0;
  const s4=()=>{const b=(p4^(p4>>1))&1;p4=(p4>>1)|(b<<3);},s5=()=>{const b=(p5^(p5>>2))&1;p5=(p5>>1)|(b<<4);},s9=()=>{const b=(p9^(p9>>4))&1;p9=(p9>>1)|(b<<8);};
  for(const [c,f,v] of seq)for(let t=0;t<per;t++,i++){
    if(++div>f){div=0;
      switch(c){case 1:s4();out=p4&1;break;
        case 2:d31=(d31+1)%31;if(d31===0||d31===18)s4();out=p4&1;break;
        case 3:s5();if(p5&1)s4();out=p4&1;break;
        case 4:case 5:out^=1;break;
        case 6:case 10:d31=(d31+1)%31;out=d31<18?1:0;break;
        case 7:case 9:s5();out=p5&1;break;
        case 8:s9();out=p9&1;break;
        case 12:case 13:d3=(d3+1)%3;if(!d3)out^=1;break;
        case 14:d31=(d31+1)%31;if(d31===0||d31===18){d3=(d3+1)%3;if(!d3)out^=1;}break;
        case 15:s5();if(p5&1){d3=(d3+1)%3;if(!d3)out^=1;}break;
        default:out=1;}}
    d[i]=(out?1:-1)*v/15*.22;}
  return buf;}
/* laser presets, one row per 1/60 s frame: [distortion, pitch divider, volume] */
const sweep=(c,f0,f1,n,v0=15,v1=4)=>Array.from({length:n},(_,k)=>[c,Math.round(f0+(f1-f0)*k/(n-1)),Math.round(v0+(v1-v0)*k/(n-1))]);
/* level every laser voice to the same loudness: scale so the first 150 ms hit a target RMS
   (matched to the soft Space laser; noisy/buzzy voices sit slightly lower because they read louder) */
function levelBuf(b,target){const d=b.getChannelData(0),sr=b.sampleRate,n=Math.min(d.length,Math.floor(sr*.15));let m=0;for(let i=0;i<n;i++)m+=d[i];m/=n;
  let e=0;for(let i=0;i<n;i++){const x=d[i]-m;e+=x*x;}const r=Math.sqrt(e/n)||1,k=target/r;for(let i=0;i<d.length;i++)d[i]=(d[i]-m)*k;return b;}
const tiaCache={};
function tiaPlay(key,make){if(!AC)return;if(!tiaCache[key])tiaCache[key]=levelBuf(tiaRender(make()),.015);const s=AC.createBufferSource();s.buffer=tiaCache[key];s.connect(MASTER);s.start();}
/* laser voices: 'Space' is the soft synth; the rest are Atari chip presets [distortion, from, to, frames, vol from, vol to] */
const LASERS=[['Space'],['1981'],['Hiss',8,0,14,12],['Pew',4,1,26,13],['Buzz',1,1,18,13],['Rasp',15,0,12,12],['Ray',12,31,4,14,12,6]];
/* altitude picks the note: A minor pentatonic over two octaves, higher on screen = higher note */
/* every wave is named for a scale, starting sweet and getting stranger */
const SCALES=[['Minor Pentatonic',[0,3,5,7,10]],['Major Pentatonic',[0,2,4,7,9]],['Ionian',[0,2,4,5,7,9,11]],['Dorian',[0,2,3,5,7,9,10]],
  ['Mixolydian',[0,2,4,5,7,9,10]],['Aeolian',[0,2,3,5,7,8,10]],['Lydian',[0,2,4,6,7,9,11]],['Phrygian',[0,1,3,5,7,8,10]],['Blues',[0,3,5,6,7,10]],
  ['Harmonic Minor',[0,2,3,5,7,8,11]],['Hirajoshi',[0,2,3,7,8]],['Whole Tone',[0,2,4,6,8,10]],['Phrygian Dominant',[0,1,4,5,7,8,10]],
  ['Hungarian Minor',[0,2,3,6,7,8,11]],['Double Harmonic',[0,1,4,5,7,8,11]],['Diminished',[0,2,3,5,6,8,9,11]],['Locrian',[0,1,3,5,6,8,10]]];
const buildScale=iv=>[...iv,...iv.map(x=>x+12),24];
let SCALE=buildScale(SCALES[0][1]);
const scaleFor=w=>SCALES[(w-1)%SCALES.length];
function noteFor(y){const fr=Math.max(0,Math.min(1,(470-y)/(470-(TOP+16))));return Math.round(fr*(SCALE.length-1));}
/* shared space FX: filtered echo plus a soft generated reverb */
let FX=null;
function fxBus(){if(FX)return FX;const inp=AC.createGain();
  const dly=AC.createDelay(1);dly.delayTime.value=.24;const fb=AC.createGain();fb.gain.value=.3;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  inp.connect(dly);dly.connect(lp);lp.connect(fb);fb.connect(dly);const wet=AC.createGain();wet.gain.value=.35;lp.connect(wet);wet.connect(MASTER);
  const len=Math.floor(AC.sampleRate*2.2),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const cv=AC.createConvolver();cv.buffer=ir;const rv=AC.createGain();rv.gain.value=.3;inp.connect(cv);cv.connect(rv);rv.connect(MASTER);
  return FX=inp;}
function spaceZap(n,when=0,pan=0){const t=AC.currentTime+when,f=ROOT()*Math.pow(2,SCALE[n]/12)*Math.pow(2,rnd(-4,4)/1200),v=rnd(.85,1);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain(),g2=AC.createGain(),pn=AC.createStereoPanner?AC.createStereoPanner():null;
  o1.type='sine';o2.type='sine';
  o1.frequency.setValueAtTime(f*1.5,t);o1.frequency.exponentialRampToValueAtTime(f,t+.045);
  o2.frequency.setValueAtTime(f*3,t);o2.frequency.exponentialRampToValueAtTime(f*2.003,t+.045);
  g2.gain.setValueAtTime(.3,t);g2.gain.exponentialRampToValueAtTime(.02,t+.12);
  lp.type='lowpass';lp.Q.value=.5;lp.frequency.setValueAtTime(2400,t);lp.frequency.exponentialRampToValueAtTime(900,t+.25);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075*v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
  o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);
  let last=g;if(pn){pn.pan.value=Math.max(-.8,Math.min(.8,pan));g.connect(pn);last=pn;}
  const dry=AC.createGain();dry.gain.value=.85;last.connect(dry);dry.connect(MASTER);
  const send=AC.createGain();send.gain.value=.55;last.connect(send);send.connect(fxBus());
  o1.start(t);o2.start(t);o1.stop(t+.32);o2.stop(t+.32);}
function zap(y=260,pan=0){if(!AC)return;const i=SET.laser%LASERS.length,L=LASERS[i],n=noteFor(y);
  if(i===0){spaceZap(n,0,pan);return;}
  if(L[0]==='1981'){defenderZap(pan);return;}
  const sh=5-Math.round(n*5/(SCALE.length-1)),cl=v=>Math.max(0,Math.min(31,v));tiaPlay('laser'+i+'_'+n,()=>sweep(L[1],cl(L[2]+sh),cl(L[3]+sh),L[4],L[5],L[6]));}
/* 1981 LASER: the algorithm Sam Dicker's 1980 Defender sound board used for the player laser.
   Sound #$14 routes to its white-noise routine: 1-bit noise from a 16-bit shift register, output at full
   amplitude or zero. Every 32 samples the amplitude drops by one step (from 255) and the delay between
   samples grows by one loop, so the noise's sample rate - and its apparent pitch - slides down as it fades.
   Timing modelled on the board's ~894.9 kHz 6802 clock (about 50 + 8*delay cycles per sample).
   Like the original single-voice board, a new shot cuts off the last one. */
let DEFBUF=null,DEFSRC=null;
function defenderBuf(){const sr=44100,len=.85,N=Math.floor(sr*len),b=AC.createBuffer(1,N,sr),d=b.getChannelData(0);
  let HI=0x5A,LO=0xC3,i=0,acc=0;
  for(let X=1;X<=255&&i<N;X++){const amp=256-X,hold=(50+8*X)/894886*sr;
    for(let c=0;c<32&&i<N;c++){let a=LO>>3;a^=LO;const cin=a&1;const hiOut=HI&1;HI=(HI>>1)|(cin<<7);const bit=LO&1;LO=(LO>>1)|(hiOut<<7);
      const v=bit?amp:0;acc+=hold;while(acc>=1&&i<N){d[i++]=v/255*.5;acc-=1;}}}
  const fade=Math.floor(sr*.35);for(let k=0;k<fade;k++){const j=N-fade+k;d[j]*=1-k/fade;}
  return b;}
function defenderZap(pan){if(!DEFBUF)DEFBUF=levelBuf(defenderBuf(),.016);if(DEFSRC){try{DEFSRC.stop();}catch(e){}}
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain(),pn=panNode(pan);s.buffer=DEFBUF;
  hp.type='highpass';hp.frequency.value=60;g.gain.value=1;s.connect(hp);hp.connect(g);g.connect(pn);pn.connect(MASTER);s.start();DEFSRC=s;}
function whistle(){tone(1500,350,1.3,'square',.018);}
function splatSound(){if(!AC)return;[[700,500],[500,300],[300,90]].forEach(([a,b],i)=>setTimeout(()=>tone(a,b,.07,'square',.05),i*55));
  setTimeout(()=>{thud();humanDown(null);},170);}
function tone(f1,f2,dur,type='square',vol=.05){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.02);}
function boom(dur=.4,vol=.2){if(!AC)return;noise();
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(100,t+dur);
  s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+dur);}

/* THE NAN II THEME, SAVES THE HUMANS CUT. Title: the tune as the boss wrote it -- G minor,
   132 BPM, his sine -- with chords and a soft beat. In play: an 8-bit arcade version,
   up a step in A minor (the key every scale here starts on, so the explosions' notes
   land in tune), and it speeds up with every wave. */
const MUSIC={
  title:{bpm:132,key:0,vol:.45,echo:.3,form:['MP','MPBd','MHPBd','OHPABdF'],
    lead:{w:'sine',v:.13,a:.01,r:.06,fx:.18},hi:{w:'sine',v:.08,a:.01,r:.06,fx:.25},harm:{w:'triangle',v:.06,a:.01,r:.06},
    pad:{w:'sawtooth',det:9,cut:1100,a:.35,r:.5,v:.022},
    arp:{w:'triangle',v:.045,pl:.09,pat:[0,1,2,3,2,1],oct:12},
    bass:{w:'triangle',v:.16,pat:'r...r...r...r.o.',gate:.9},
    drums:{kit:'soft',k:'x.......x.......',h:'..x...x...x...x.',s:'....x.......x...'}},
  play:{bpm:140,key:2,vol:.58,echo:.22,form:['MBd','MABD','OHABDF','EPABD','MABD','OHAPBDF'],
    lead:{w:'pulse',v:.07,cut:3200,len:1.6,fx:.1},hi:{w:'square',v:.04,cut:2600,len:1.6},harm:{w:'pulse',v:.045,cut:2400,len:1.6},
    pad:{w:'square',v:.012,cut:900,a:.03,r:.1},
    arp:{w:'square',v:.028,cut:2600,pl:.07,pat:[0,1,2,3,4,3,2,1],oct:12},
    bass:{w:'triangle',v:.17,pat:'r.r.o.r.r.r.o.r.',gate:.75},
    drums:{kit:'chip',k:'x.....x...x.....',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.'}},
  /* game over: the last bar's notes, slowed and falling, onto a G minor chord */
  over:{bpm:96,key:2,vol:.5,once:true,len:40,seq:[[0,3,65],[4,3,62],[8,3,58],[12,22,55],[12,22,43,'bass'],[12,22,50,'pad'],[12,22,58,'pad'],[12,22,62,'pad']],
    lead:{w:'triangle',v:.1,vib:.3,r:.4,fx:.3},pad:{w:'sawtooth',det:10,cut:1000,a:.15,r:1,v:.022},bass:{w:'sine',v:.14,r:.8}}};
function musicWant(){if(!G)return {id:'title'};
  if(G.state==='over')return {id:G.overT<5?'over':'title'};
  return {id:'play',bpm:Math.min(168,140+3*(G.wave-1)),muffle:G.state==='paused'};}
/* ================= NAN II THEME MUSIC =================
   The boss's NAN II Theme, written in his Melody Cartridge (2026-09-24): four bars of
   G minor at 132 BPM, 29 eighth notes. This engine is the same in all three NAN II
   games; each game dresses the tune in its own arrangements (MUSIC, just above):

   drain/refill: wheel per second (full lasts ~2.4 s; empty refills in ~3.6 s after a rest).
   unlock: how full a spent wheel must get before boost works again. */
const BOOST={thrust:2.2,top:920,drain:.42,refill:.28,rest:.7,unlock:.35,linger:.7,ease:900};
/* THE GROUND (the boss, 2026-09-24): touch it and NAN II drives like a car; A launches him back
   into the air. grav: how hard a slope pulls him; fall: gravity when a crest throws him;
   brake: how much harder the stick bites against the roll than it drives; launch: A's kick;
   headoff: how fast he must be driving for a human he runs down to lose its head. */
const DRIVE={grav:900,fall:1500,brake:2.2,launch:430,headoff:380};
const slopeAt=x=>(groundY(x+4)-groundY(x-4))/8;
function touchdown(p,k){if(AC)tone(150,70,.14,'square',.035*k);
  for(let i=0;i<Math.round(10*k);i++){const sd=Math.random()<.5?-1:1;
    G.dust.push({x:wrap(p.x+rnd(-12,12)),y:groundY(p.x)-2,vx:sd*rnd(60,160)+p.vx*.2,vy:-rnd(30,90),life:rnd(.4,.8),max:.8,g:60});}}
function land(p){p.drive=true;p.air=false;p.vy=0;p.tilt=Math.atan(slopeAt(p.x));p.boosting=false;touchdown(p,1);}
function launch(p){p.drive=false;p.air=false;p.vy=-DRIVE.launch;p.launchT=.35;p.tilt=0;G.shake=Math.max(G.shake,3);
  if(AC)tone(200,760,.22,'sawtooth',.035);touchdown(p,.8);}
/* a human run down fast: the head flies, spinning, and rolls where it lands */
function headOff(h,p){G.wreck.push({k:'head',x:h.x,y:h.y-12,vx:p.vx*.7+rnd(-40,40),vy:-rnd(280,420),a:0,va:rnd(-14,14),dir:1,life:4,r:3});
  if(AC)tone(900,260,.14,'square',.03);}
/* THE GUN TURNED UP (driving): the beam climbs straight up, carried along with NAN II's roll. It hits
   the aliens above him -- and any human a lander is carrying off, so pick the moment. */
function upLaser(l,dt){const step=l.spd*dt,from=l.y;l.y-=step;l.x=wrap(l.x+(l.vx||0)*dt);l.life-=dt;l.trail=Math.min(170,l.trail+step);
  if(l.y<TOP){l.life=0;return;}
  for(const e of G.enemies){if(e.dead)continue;const d=from-e.y;if(d>=-14&&d<=step+14&&Math.abs(wd(e.x,l.x))<16){killEnemy(e);l.life=0;return;}}
  for(const h of G.humans){if(h.gone||h.state==='carried'||h.state==='walk')continue;const d=from-(h.y-3);if(d>=-6&&d<=step+6&&Math.abs(wd(h.x,l.x))<6){hurtHuman(h);l.life=0;return;}}}
/* THE WHEELS, out while NAN II drives, turning with the ground he covers -- and the gun, turned up */
function drawWheels(p){ctx.strokeStyle=C.ship;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.dir*9,-4);ctx.lineTo(p.dir*9,-19);ctx.stroke();for(const wx of [-9,9]){ctx.save();ctx.translate(wx,13);ctx.rotate(p.roll||0);
  ctx.beginPath();ctx.arc(0,0,4.6,0,TAU);ctx.fillStyle='#000';ctx.fill();ctx.strokeStyle=C.ship;ctx.lineWidth=1.6;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4.6,0);ctx.lineTo(4.6,0);ctx.moveTo(0,-4.6);ctx.lineTo(0,4.6);ctx.lineWidth=1;ctx.stroke();ctx.restore();}}
/* the wheel rides behind the ship: hidden when full, drains while boosting, blinks dim when spent */
function drawWheel(x,y,p){if(p.wheelT<=0)return;const cx=x-p.dir*36,cy=y-26,r=11;
  ctx.save();ctx.globalAlpha=Math.min(1,p.wheelT/BOOST.linger*1.5);ctx.lineWidth=4;ctx.lineCap='butt';
  ctx.strokeStyle=C.faint;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();
  if(p.stam>0&&!(p.boostLock&&Math.floor(T*8)%2)){ctx.strokeStyle=p.boostLock?C.dim:C.ink;
    ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+TAU*p.stam);ctx.stroke();}
  ctx.restore();}

/* ---------- update ---------- */
function update(dt,inp){
  if(G.state==='over'){G.overT+=dt;if(G.overT>1&&(inp.startP||inp.fireP||inp.boostP))newGame();return;}
  if(inp.startP){G.state=G.state==='paused'?'play':'paused';G.menu=0;}
  if(G.state==='paused'){menuInput(inp);return;}
  G.shake=Math.max(0,G.shake-dt*28);
  if(G.hitStop>0){G.hitStop-=dt;return;}
  const p=G.player,sp=pace();
  G.comboT=Math.max(0,G.comboT-dt);if(!G.comboT)G.combo=0;
  if(G.pw){G.pw.t-=dt;if(G.pw.t<=0)endPower();}
  G.msgT-=dt;G.alarmT=Math.max(0,G.alarmT-dt);G.flash=Math.max(0,G.flash-dt*2.5);

  if(p.alive){
    /* on the ground, A launches him */
    if(p.drive&&inp.boostP)launch(p);
    /* BOOST: hold A (or shift) while flying and moving to burn the endurance wheel for
       speed. The wheel refills after a short rest; run it dry and boost locks until it is a
       third full again, so it cannot be feathered at empty. */
    const want=!p.drive&&inp.boost&&inp.x!==0&&!p.boostLock&&p.stam>0;
    if(want&&!p.boosting&&AC)tone(170,520,.18,'sawtooth',.022);
    p.boosting=want;
    if(p.boosting){p.stam=Math.max(0,p.stam-BOOST.drain*dt);p.regenT=BOOST.rest;
      if(p.stam<=0){p.boostLock=true;p.boosting=false;if(AC)tone(260,80,.35,'square',.03);}}
    else{p.regenT=Math.max(0,p.regenT-dt);if(p.regenT<=0)p.stam=Math.min(1,p.stam+BOOST.refill*dt);
      if(p.boostLock&&p.stam>=BOOST.unlock){p.boostLock=false;if(AC)tone(440,660,.08,'triangle',.02);}}
    p.wheelT=(p.stam<1||p.boosting)?BOOST.linger:Math.max(0,p.wheelT-dt);
    p.thrust=inp.x!==0;p.lift=!p.drive&&inp.y<-.3?1:0;if(inp.x!==0){p.dir=inp.x>0?1:-1;
      /* on the ground, pushing against the roll brakes: it bites harder than it drives */
      p.vx+=inp.x*SET.thrust*255*dt*(p.boosting?BOOST.thrust:1)*(p.drive&&p.vx*inp.x<0?DRIVE.brake:1);}
    p.vx-=p.vx*SET.fric*.23*dt;
    if(p.drive&&!p.air){const s=slopeAt(p.x);p.vx+=DRIVE.grav*s/Math.sqrt(1+s*s)*dt;}   /* downhill speeds him up, uphill slows him */
    /* top speed: 560, or BOOST.top while boosting. After a boost the LIMIT eases back down
       to 560 (BOOST.ease a second), so the ship slows smoothly instead of snapping -- and it
       is a hard limit: no Thrust or Friction setting carries him past it. (Easing off only
       the excess, as it first did, was outrun by strong Thrust and low Friction: plain
       flight ran away to ~1500 and boost, held at 920, was slower.) */
    p.top=p.boosting?BOOST.top:Math.max(560,(p.top||560)-BOOST.ease*dt);
    p.vx=Math.max(-p.top,Math.min(p.top,p.vx));
    p.x=wrap(p.x+p.vx*dt);
    if(p.drive){/* the wheels on the ground -- or in the air, thrown off a crest, until gravity brings them down */
      const gy=groundY(p.x)-17;p.vy=(p.vy||0)+DRIVE.fall*dt;p.y+=p.vy*dt;
      if(p.y>=gy){if(p.air&&p.vy>260)touchdown(p,.5);p.y=gy;p.vy=slopeAt(p.x)*p.vx;p.air=false;}else p.air=true;
      if(!p.air)p.tilt=(p.tilt||0)+(Math.atan(slopeAt(p.x))-(p.tilt||0))*Math.min(1,12*dt);
      p.roll=(p.roll||0)+p.vx*dt/5.75;}
    else{/* eased climb and dive: velocity glides toward the stick instead of snapping */
      const tv=inp.y*320;p.vy=(p.vy||0)+(tv-(p.vy||0))*Math.min(1,(inp.y?3.6:4.2)*dt);p.y+=p.vy*dt;
      const lo=TOP+16,hi=groundY(p.x)-17;if(p.y<lo){p.y=lo;p.vy=Math.max(0,p.vy);}
      if(p.y>hi){p.y=hi;p.vy=Math.min(0,p.vy);if(!(p.launchT>0))land(p);}}   /* touching the ground: he drives */
    p.launchT=Math.max(0,(p.launchT||0)-dt);
    p.ax=Math.max(-3000,Math.min(3000,(p.vx-(p.lvx??p.vx))/dt));p.ay=Math.max(-3000,Math.min(3000,(p.vy-(p.lvy??p.vy))/dt));p.lvx=p.vx;p.lvy=p.vy;
    /* jet trails: motes shed from the back jet (and the foot nubs when climbing); longer-lived at speed */
    const spd=Math.abs(p.vx)/560;G.trailAcc+=(p.drive?0:p.boosting?200:p.thrust?90:18)*dt;
    while(G.trailAcc>=1){G.trailAcc--;const lf=.3+spd*.7;G.trail.push({x:wrap(p.x-p.dir*20+rnd(-2,2)),y:p.y-6+rnd(-2.5,2.5),vx:p.vx*.15-p.dir*rnd(50,120),vy:rnd(-14,14),life:lf,max:lf});}
    if(p.lift&&Math.random()<dt*60)for(const fx of [8,-7.5])G.trail.push({x:wrap(p.x+p.dir*fx+rnd(-1,1)),y:p.y+15,vx:p.vx*.2,vy:rnd(70,130),life:.3,max:.3});
    /* ground dust when skimming low */
    const gap=groundY(p.x)-(p.y+14);if(gap<42){G.dustAcc+=(1-gap/42)*(p.drive?Math.abs(p.vx)/5:30+Math.abs(p.vx)/6)*dt;
      while(G.dustAcc>=1){G.dustAcc--;const sd=Math.random()<.5?-1:1;G.dust.push({x:wrap(p.x+rnd(-10,10)),y:groundY(p.x)-2,vx:sd*rnd(40,130)+p.vx*.25,vy:-rnd(15,60),life:rnd(.4,.8),max:.8,g:60});}}
    p.inv=Math.max(0,p.inv-dt);p.fireCd-=dt;
    if(inp.fireP||(inp.fire&&p.fireCd<=0)){const rf=G.pw&&G.pw.k==='rapid';fireLaser();if(rf){{const l=G.lasers[G.lasers.length-1];G.lasers.push(l.up?{...l,x:wrap(l.x-p.dir*8)}:{...l,y:p.y-6});}}p.fireCd=rf?.06:.16;}
    if(inp.bombP&&G.bombs>0){G.bombs--;smartBomb();}
  }else{G.deadT-=dt;if(G.deadT<=0){if(G.lives>0){p.alive=true;p.inv=2.5;p.vx=0;p.vy=0;p.y=240;p.drive=false;p.air=false;p.tilt=0;p.stam=1;p.boosting=false;p.boostLock=false;p.regenT=0;G.bullets=[];}else{G.state='over';G.overT=0;saveHigh();}}}

  {/* smooth-damped camera swing: eases in and out, speed-capped, lead grows with speed */
    const lead=W*(.12+.08*Math.min(1,Math.abs(p.vx)/300)),tgt=W/2-p.dir*lead;
    const st=.85,om=2/st,x=om*dt,e=1/(1+x+.48*x*x+.235*x*x*x);let ch=G.camOff-tgt;const mx=420*st;ch=Math.max(-mx,Math.min(mx,ch));
    const tmp=(G.camVel+om*ch)*dt;G.camVel=(G.camVel-om*tmp)*e;G.camOff=(G.camOff-ch)+(ch+tmp)*e;}G.camX=wrap(p.x-G.camOff);

  for(const l of G.lasers){if(l.up){upLaser(l,dt);continue;}const step=l.spd*dt,from=l.x;l.x=wrap(l.x+l.dir*step);l.life-=dt;l.trail=Math.min(170,l.trail+step);
    for(const e of G.enemies){if(e.dead)continue;const d=wd(e.x,from)*l.dir;if(d>=-14&&d<=step+14&&Math.abs(e.y-l.y)<13){killEnemy(e);l.life=0;break;}}
    if(l.life>0)for(const h of G.humans){if(h.gone||h.state==='carried')continue;const d=wd(h.x,from)*l.dir;if(d>=-6&&d<=step+6&&Math.abs(h.y-3-l.y)<12){hurtHuman(h);l.life=0;break;}}}
  G.lasers=G.lasers.filter(l=>l.life>0);
  /* SLOW TIME: the world below runs at a third speed; NAN II and his lasers stay at full speed */
  if(G.pw&&G.pw.k==='slow')dt*=.33;

  for(const e of G.enemies){if(e.dead)continue;
    if(e.kind==='lander'){e.bob+=dt*2;
      if(e.target&&e.target.gone){e.target=null;e.state='seek';}
      if(e.state==='seek'){
        if(!e.target){const free=G.humans.filter(h=>h.state==='walk'&&!h.claimed);
          if(free.length){free.sort((a,b)=>Math.abs(wd(a.x,e.x))-Math.abs(wd(b.x,e.x)));e.target=free[0];free[0].claimed=true;}}
        let want;if(e.target){const d=wd(e.target.x,e.x);want=Math.sign(d)*75*sp;if(Math.abs(d)<4)e.state='down';}else want=Math.sin(e.bob*.3)*50*sp;
        e.vx+=(want-e.vx)*Math.min(1,2*dt);e.x=wrap(e.x+e.vx*dt);e.y+=(TOP+100+Math.sin(e.bob)*30-e.y)*Math.min(1,dt);
      }else if(e.state==='down'){const h=e.target;e.x=h.x;e.y+=75*sp*dt;
        if(e.y>=h.y-18){h.state='held';e.state='up';tone(300,620,.35,'triangle',.05);if(onScreen(e.x)||Math.abs(wd(e.x,p.x))<1200){say('Warning! A human is being taken',1.6);G.alarmT=1.2;}}
      }else if(e.state==='up'){const h=e.target;e.y-=48*sp*dt;h.x=e.x;h.y=e.y+18;
        if(e.y<TOP+12){removeHuman(h);toMutant(e);say('A human was lost',1.6);}}
      e.cd-=dt;if(e.cd<=0){e.cd=rnd(1.8,3.6)/sp;if(onScreen(e.x))shootAt(e);}
    }else{
      const dx=wd(p.x,e.x),dy=p.y-e.y,msp=210*sp;
      e.vx+=(Math.sign(dx)*msp-e.vx)*Math.min(1,3*dt);
      e.vy+=((Math.abs(dx)<300?Math.sign(dy)*130*sp:0)+rnd(-160,160)*sp-e.vy)*Math.min(1,4*dt);
      e.x=wrap(e.x+e.vx*dt);e.y=Math.max(TOP+12,Math.min(groundY(e.x)-14,e.y+e.vy*dt));
      e.cd-=dt;if(e.cd<=0){e.cd=rnd(1,2.2)/sp;if(onScreen(e.x))shootAt(e);}
    }
    if(p.alive&&p.inv<=0&&Math.abs(wd(e.x,p.x))<(G.pw&&G.pw.k==='shield'?30:18)&&Math.abs(e.y-p.y)<(G.pw&&G.pw.k==='shield'?28:14)){killEnemy(e);if(!(G.pw&&G.pw.k==='shield'))killPlayer();}
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  /* the scale bird: flaps across now and then; ram it with NAN II to change the scale */
  if(!G.bird){G.birdT-=dt;if(G.birdT<=0){const side=Math.random()<.5?-1:1;
      G.bird={x:wrap(p.x+side*W*.75),y0:rnd(TOP+80,360),y:0,vx:-side*rnd(70,110),t:rnd(0,9),life:16};G.birdT=rnd(20,34);
      tone(1320,1760,.12,'triangle',.03);setTimeout(()=>tone(1760,2200,.12,'triangle',.03),140);}}
  else{const b=G.bird;b.t+=dt;b.life-=dt;b.x=wrap(b.x+b.vx*dt);b.y=b.y0+Math.sin(b.t*1.7)*45;
    if(p.alive&&Math.abs(wd(b.x,p.x))<24&&Math.abs(b.y-p.y)<22){
      grantPower();addScore(1000,b);G.shake=Math.max(G.shake,6);
      burst(b.x,b.y,C.ink,36,300);for(let i=0;i<24;i++){const a=i/24*TAU;G.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,life:.9,max:1,col:C.ink});}
      G.flash=.5;boom(.4,.12);G.bird=null;}
    else if(b.life<=0&&!onScreen(b.x))G.bird=null;}

  for(const b of G.bullets){b.x=wrap(b.x+b.vx*dt);b.y+=b.vy*dt;b.life-=dt;
    if(p.alive&&p.inv<=0&&Math.abs(wd(b.x,p.x))<(G.pw&&G.pw.k==='shield'?28:10)&&Math.abs(b.y-p.y)<(G.pw&&G.pw.k==='shield'?26:9)){b.life=0;if(G.pw&&G.pw.k==='shield'){burst(b.x,b.y,C.ink,6,120);}else killPlayer();}}
  G.bullets=G.bullets.filter(b=>b.life>0&&b.y>TOP&&b.y<H);

  for(const h of G.humans){
    if(h.state==='walk'){if(Math.random()<dt*.2)h.vx=-h.vx;h.x=wrap(h.x+h.vx*dt);h.y=groundY(h.x)-6;h.safe=Math.max(0,(h.safe||0)-dt);
      if(p.alive&&h.safe<=0&&Math.abs(wd(h.x,p.x))<15&&Math.abs(h.y-p.y)<20){
        /* run down while he drives fast: the head goes flying */
        if(p.drive&&Math.abs(p.vx)>DRIVE.headoff)headOff(h,p);hurtHuman(h);}}
    else if(h.state==='fall'){const ff=G.pw&&G.pw.k==='feather';h.vy+=(ff?40:110)*dt;if(ff)h.vy=Math.min(h.vy,45);h.y+=h.vy*dt;
      if(p.alive&&Math.abs(wd(h.x,p.x))<22&&Math.abs(h.y-p.y)<22){h.state='carried';h.th=0;h.om=0;addScore(500,h);tone(660,1320,.2,'triangle',.06);}
      else if(h.y>=groundY(h.x)-6){if(groundY(h.x)-6-(h.fy0??h.y)>90&&!(G.pw&&G.pw.k==='feather')){h.gone=true;G.splats.push({x:h.x,t:8,seed:Math.random()});burst(h.x,groundY(h.x)-2,C.ink,14,120);splatSound();G.pops.push({x:h.x,y:h.y-20,t:1.4,txt:'SPLAT'});}else{h.state='walk';h.claimed=false;h.safe=1.5;h.y=groundY(h.x)-6;addScore(250,h);}}}
    else if(h.state==='carried'){if(!p.alive){h.state='fall';h.vy=0;h.fy0=h.y;}else{
      /* a pendulum hanging from NAN II's base: swings with his acceleration */
      const L=22,gx=-(p.ax||0),gy=600-(p.ay||0);h.om=(h.om||0)+((gx*Math.cos(h.th||0)-gy*Math.sin(h.th||0))/L-1.6*(h.om||0))*dt;
      h.th=Math.max(-1.35,Math.min(1.35,(h.th||0)+h.om*dt));h.x=wrap(p.x+Math.sin(h.th)*L);h.y=p.y+14+Math.cos(h.th)*L;
      if(p.y>groundY(p.x)-52){h.state='walk';h.claimed=false;h.safe=2;h.y=groundY(h.x)-6;addScore(500,h);say('Human home safe',1.2);tone(880,1760,.25,'triangle',.06);}}}
  }
  G.humans=G.humans.filter(h=>!h.gone);
  if(G.humans.length===0&&!G.fallen){G.fallen=true;for(const e of G.enemies)if(e.kind==='lander')toMutant(e);say('The humans are gone',2.6);}

  G.spawnT-=dt;
  if(G.toSpawn>0&&(G.spawnT<=0||G.enemies.length===0)){const n=Math.min(5,G.toSpawn);for(let i=0;i<n;i++)spawnLander();G.toSpawn-=n;G.spawnT=9;}
  if(G.toSpawn===0&&G.enemies.length===0){G.waveT+=dt;
    if(!G.waveDone){G.waveDone=true;const b=G.humans.length*100*Math.min(G.wave,5);addScore(b,null);say('Wave '+G.wave+' clear, bonus '+b,2.6);}
    if(G.waveT>3)startWave();}

  for(const q of G.parts){q.x=wrap(q.x+q.vx*dt);q.y+=q.vy*dt;q.vx*=1-1.5*dt;q.vy*=1-1.5*dt;q.life-=dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.trail){q.x=wrap(q.x+q.vx*dt);q.y+=q.vy*dt;q.vx*=1-2*dt;q.life-=dt;}G.trail=G.trail.filter(q=>q.life>0);
  for(const q of G.dust){q.x=wrap(q.x+q.vx*dt);q.y+=q.vy*dt;q.vy+=q.g*dt;q.vx*=1-2.5*dt;q.life-=dt;}G.dust=G.dust.filter(q=>q.life>0);
  for(const r of G.rings)r.t+=dt;G.rings=G.rings.filter(r=>r.t<.35);
  const phys=(q,bounce)=>{q.vy+=520*dt;q.x=wrap(q.x+q.vx*dt);q.y+=q.vy*dt;q.a+=q.va*dt;const gy=groundY(q.x)-(q.r||1);
    if(q.y>gy){q.y=gy;q.vy=Math.abs(q.vy)>40?-q.vy*bounce:0;q.vx*=.65;q.va*=.6;q.ground=true;}else q.ground=false;q.life-=dt;};
  for(const q of G.debris)phys(q,.35);G.debris=G.debris.filter(q=>q.life>0);
  for(const q of G.wreck){phys(q,.4);
    if((q.k==='bubble'||q.k==='head')&&q.ground){q.vx*=Math.pow(.55,dt);q.a+=q.vx/q.r*dt;}
    if(q.k==='pack'&&q.sput>0){q.sput-=dt;if(Math.random()<dt*40)G.dust.push({x:q.x,y:q.y,vx:rnd(-20,20),vy:-rnd(30,70),life:rnd(.5,1),max:1,g:-20});}}
  G.wreck=G.wreck.filter(q=>q.life>0);
  for(const q of G.splats)q.t-=dt;G.splats=G.splats.filter(q=>q.t>0);
  for(const q of G.pops){q.t-=dt;q.y-=22*dt;}G.pops=G.pops.filter(q=>q.t>0);
}

/* ===== NAN II FACE FONT: Jody's own lettering, rebuilt as strokes on a 5x7 grid =====
   Square shoulders, softened corners, serifed I, all capitals, monospaced. */
const GLYPHS=(()=>{const O=[[1,0],[4,0],[5,1],[5,6],[4,7],[1,7],[0,6],[0,1],[1,0]];

  ctx.font='16px '+FB;ctx.fillStyle=C.dim;txt('HI '+Math.max(HIGH,G.score)+' W'+G.wave,20,54);
  const X0=270,SW=430,Y0=8,SH=TOP-18;ctx.strokeStyle=C.dim;ctx.lineWidth=2;ctx.strokeRect(X0+.5,Y0+.5,SW,SH);
  const mx=x=>X0+((wd(x,p.x)+WW/2)/WW)*SW,my=y=>Y0+(y-TOP)/(H-TOP)*SH;
  ctx.beginPath();for(let i=0;i<=SW;i+=4){const wx=wrap(p.x-WW/2+i/SW*WW);const y=my(groundY(wx));i?ctx.lineTo(X0+i,y):ctx.moveTo(X0,y);}ctx.strokeStyle=C.ground;ctx.lineWidth=2;ctx.stroke();
  const bw=W/WW*SW,bx=mx(G.camX);ctx.strokeStyle=C.dim;ctx.lineWidth=2;ctx.strokeRect(bx,Y0+2,bw,SH-4);
  for(const h of G.humans){ctx.fillStyle=C.ink;ctx.fillRect(mx(h.x)-2,my(h.y)-2,4,4);}
  if(G.bird){ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.strokeRect(mx(G.bird.x)-4,my(G.bird.y)-4,8,8);}
  for(const e of G.enemies){ctx.fillStyle=e.kind==='lander'?C.lander:C.mutant;ctx.fillRect(mx(e.x)-3,my(e.y)-3,6,6);}
  if(p.alive&&Math.floor(T*6)%2){ctx.fillStyle=C.ship;ctx.fillRect(mx(p.x)-5,my(p.y)-2,10,4);}
  for(let i=0;i<Math.min(G.lives,6);i++)drawShip(W-34-i*36,26,1,false,.55);
  for(let i=0;i<Math.min(G.bombs,6);i++){ctx.fillStyle=C.mutant;ctx.fillRect(W-32-i*18,42,10,10);}}
const MENU=['Friction','Thrust','Laser','Color','Volume','Music','Manual','Resume','Exit game'];
function menuInput(inp){if(inp.bombP){G.state='play';return;}/* B goes back; A or X picks */const n=MENU.length;const ok=inp.fireP||inp.boostP;if(inp.upP)G.menu=(G.menu+n-1)%n;if(inp.downP)G.menu=(G.menu+1)%n;
  const d=(inp.rightP?1:0)-(inp.leftP?1:0),m=MENU[G.menu];
  if(d){if(m==='Friction'){SET.fric=Math.max(0,Math.min(10,SET.fric+d));saveSet();}
    else if(m==='Thrust'){SET.thrust=Math.max(1,Math.min(10,SET.thrust+d));saveSet();}
    else if(m==='Laser'){SET.laser=(SET.laser+LASERS.length+d)%LASERS.length;saveSet();zap(G.player.y);}
    else if(m==='Color')setPhos(phos+(d>0?1:-1));else if(m==='Volume')B9VOL.set(B9VOL.level+d);else if(m==='Music')B9MUS.setLevel(B9MUS.level+d);tone(700,700,.05,'square',.03);}
  if(ok&&m==='Resume')G.state='play';
  if(ok&&m==='Music')B9MUS.toggle();
  if(ok&&m==='Manual')manOpen();
  if(ok&&m==='Exit game')exitGame();}
function drawMenu(){ctx.clearRect(0,TOP,W,H-TOP);ctx.textAlign='center';ctx.fillStyle=C.ink;ctx.font='40px '+FT;txt('Paused',W/2,150);
  const bar=v=>'#'.repeat(v)+'-'.repeat(10-v),names=HUE_NAMES.map(n=>n[0].toUpperCase()+n.slice(1));
  const vals=[bar(SET.fric)+' '+String(SET.fric).padStart(2),bar(SET.thrust)+' '+String(SET.thrust).padStart(2),LASERS[SET.laser%LASERS.length][0],names[phos],B9VOL.level?String(B9VOL.level):'Off',B9MUS.on?String(B9MUS.level):'Off','','',''];
  ctx.font='16px '+FB;MENU.forEach((m,i)=>{const y=210+i*25,on=i===G.menu;ctx.fillStyle=on?C.ink:C.dim;
    ctx.textAlign='left';txt((on?'> ':'  ')+m,250,y);ctx.textAlign='right';txt(vals[i],720,y);});
  ctx.textAlign='center';ctx.fillStyle=C.dim;
  ['Up and down to choose, left and right to change','Friction 0 is pure space. 10 stops on a dime.','Now playing: '+G.scaleName,'Start to resume'].forEach((l,i)=>txt(l,W/2,440+i*27));}
function overlay(title,lines){ctx.clearRect(0,TOP,W,H-TOP);ctx.textAlign='center';ctx.fillStyle=C.ink;ctx.font='48px '+FT;txt(title,W/2,250);
  ctx.font='16px '+FB;lines.forEach((l,i)=>txt(l,W/2,300+i*32));}
const TITLE_PICKS=['Start','Manual','Exit game'];let TSEL=0;

/* THE MANUAL (see gameplay.py): what is on the screen and what the buttons do */
const MAN={open:false,page:0};
function manOpen(){MAN.open=true;MAN.page=0;if(AC)tone(660,880,.06,'square',.03);}
function manClose(){MAN.open=false;if(AC)tone(880,660,.06,'square',.03);}
function manInput(next,back,close){if(close){manClose();return;}
  if(next){if(MAN.page<MAN_PAGES.length-1){MAN.page++;if(AC)tone(700,700,.04,'square',.03);}else manClose();}
  else if(back&&MAN.page>0){MAN.page--;if(AC)tone(700,700,.04,'square',.03);}}
function manWrap(s,max){const out=[];let line='';for(const w of s.split(' ')){if(line&&(line+' '+w).length>max){out.push(line);line=w;}else line=line?line+' '+w:w;}if(line)out.push(line);return out;}
function manDraw(){const P=MAN_PAGES[MAN.page];ctx.save();ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,.96)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle=C.dim;ctx.font='13px x';txt('MANUAL   '+(MAN.page+1)+' / '+MAN_PAGES.length,W/2,40);
  ctx.fillStyle=C.ink;ctx.font='28px x';txt(P.t,W/2,82);ctx.font='16px x';let y=126;
  for(const row of P.r){if(typeof row==='string'){ctx.textAlign='center';ctx.fillStyle=C.ink;for(const l of manWrap(row,56)){txt(l,W/2,y);y+=24;}y+=8;continue;}
    ctx.textAlign='right';ctx.fillStyle=C.ink;txt(row[0],296,y);ctx.textAlign='left';ctx.fillStyle=C.dim;for(const l of manWrap(row[1],40)){txt(l,318,y);y+=24;}y+=8;}
  ctx.textAlign='center';ctx.fillStyle=C.dim;ctx.font='13px x';txt(MAN.page<MAN_PAGES.length-1?'LEFT RIGHT TURN THE PAGE     A NEXT     B CLOSE':'LEFT GOES BACK     A OR B CLOSE',W/2,H-20);ctx.restore();}
const MAN_PAGES=[
 {t:'NAN II SAVES THE HUMANS',r:['Landers come down to kidnap the humans on the ground.','Shoot a lander that is carrying one away, and the human falls. Catch them in the air and fly them down to the ground: 500 points.','If a lander gets a human to the top of the sky, the human is lost and the lander turns into a mutant that hunts NAN II.','Clear every alien to finish the wave. Every human still safe is a bonus.']},
 {t:'WHAT YOU SEE',r:[['TOP LEFT','your score, the high score and the wave'],['TOP MIDDLE','the scanner: the whole world shrunk. Dots are humans and aliens, the box is what you can see, NAN II blinks.'],['TOP RIGHT','the B9s you have left, and your smart bombs under them'],['BEHIND NAN II','the boost wheel: it empties as you boost and fills when you rest'],['THE BIRD','ram it for a power: slow time, rapid fire, shield or feather fall. The screen takes its colour while it lasts.']]},
 {t:'THE NAN II CONTROLLER',r:[['STICK','fly. Touch the ground to land and drive'],['X OR RB','fire. Higher on the screen plays a higher note'],['A','boost. On the ground, A launches NAN II'],['B OR LB','smart bomb: every alien on the screen'],['START','pause: volume, music and this manual'],['DRIVING','the gun points up. Go gently past humans'],['KEYBOARD','arrows, space fires, shift boosts, K bombs, enter pauses']]}];
function titleScreen(){ctx.clearRect(0,0,W,440);ctx.textAlign='center';
  ctx.fillStyle=C.ship;ctx.font='56px '+FT;txt('NAN II Saves',W/2,100);txt('The Humans',W/2,160);
  drawShip(W/2-150,206,1,true,1.4);drawLander(W/2+40,196);drawHuman(W/2+40,230,true);drawMutant(W/2+150,206);
  ctx.fillStyle=C.ink;ctx.font='16px '+FB;
  ['Landers are kidnapping the humans.','Shoot one and catch who falls.','Fly them home to the ground.'].forEach((l,i)=>txt(l,W/2,276+i*26));
  ctx.fillStyle=C.dim;
  ['Move    arrows  WASD  stick','Fire  space  J  X    Boost  shift  A','Bomb  K  B            Pause  enter  start','Laser  L    Color  C    Music  M'].forEach((l,i)=>txt(l,W/2,350+i*22));
  txt(padSeen?'Gamepad connected':'Press a pad button to wake it',W/2,446);
  if(HIGH)txt('HI '+HIGH,W/2,536);
  ctx.font='22px '+FT;TITLE_PICKS.forEach((n,i)=>{const on=i===TSEL;ctx.fillStyle=on?C.ink:C.dim;txt((on?'> ':'  ')+n+(on?' <':'  '),W/2,468+i*23);});}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;const inp=readInput();
  if(MAN.open)manInput(inp.rightP||inp.boostP||inp.fireP,inp.leftP,inp.bombP||inp.startP);else if(!G){titleCam=wrap(titleCam+40*dt);if(inp.upP||inp.downP){TSEL=(TSEL+(inp.downP?1:TITLE_PICKS.length-1))%TITLE_PICKS.length;tone(700,700,.05,'square',.03);}if(inp.startP||inp.fireP||inp.boostP){const m=TITLE_PICKS[TSEL];if(m==='Exit game')exitGame();else if(m==='Manual')manOpen();else newGame();}}else update(dt,inp);
  if(inp.colorP)setPhos(phos+1);
  /* L key or Select: switch laser voice instantly, show its name, and fire a sample */
  if(inp.lzrP){audio();SET.laser=(SET.laser+1)%LASERS.length;saveSet();if(G){say('Laser: '+LASERS[SET.laser][0],1.4);}zap(G?G.player.y:260,0);}
  {const pl=G&&G.state==='play'&&G.player.alive;engine(pl,pl&&G.player.thrust?1:0,pl&&G.player.lift?1:0,pl?Math.abs(G.player.vx):0);}
  draw();if(MAN.open)manDraw();blit();requestAnimationFrame(frame);}
const pers=document.createElement('canvas');pers.width=480;pers.height=270;const pctx=pers.getContext('2d');
const tint=[0,1].map(()=>{const c=document.createElement('canvas');c.width=480;c.height=270;return c;});
function blit(){
  /* 4. afterglow: old light fades over a few frames; new light is instant */
  const keep=FXS.afterglow/100*.85;pctx.globalCompositeOperation='destination-out';pctx.fillStyle=`rgba(0,0,0,${1-keep})`;pctx.fillRect(0,0,480,270);
  pctx.globalCompositeOperation='source-over';pctx.drawImage(buf,0,0);
  /* 6. breathing: none in a game -- the boss wants the screen steady while he plays (2026-09-23) */
  const br=1,gb=1;
  gctx.clearRect(0,0,160,90);gctx.imageSmoothingEnabled=true;gctx.drawImage(pers,0,0,160,90);
  out.globalCompositeOperation='source-over';out.globalAlpha=1;out.fillStyle='#000';out.fillRect(0,0,W,H);
  const sk=G&&G.shake>0?G.shake:0,ox=rnd(-sk,sk),oy=rnd(-sk,sk);
  out.imageSmoothingEnabled=false;out.globalAlpha=br;out.drawImage(pers,ox,oy,W,H);
  /* 1. bloom: blurred copy at 35-90% opacity */
  if(FXS.bloom>0){out.imageSmoothingEnabled=true;out.globalCompositeOperation='lighter';out.globalAlpha=(.35+.55*FXS.bloom/100)*gb;out.drawImage(glow,ox,oy,W,H);}
  /* 8. alarm bleed: red copy 4 px left, cyan copy 4 px right, additive at 32% */
  if(FXS.alarmBleed&&G&&G.alarmT>0){[ALARM.red,ALARM.cyan].forEach((col,i)=>{const t=tint[i].getContext('2d');t.globalCompositeOperation='source-over';t.clearRect(0,0,480,270);
      t.drawImage(pers,0,0);t.globalCompositeOperation='source-in';t.fillStyle=col;t.fillRect(0,0,480,270);
      out.imageSmoothingEnabled=false;out.globalCompositeOperation='lighter';out.globalAlpha=.32*Math.min(1,G.alarmT*2);out.drawImage(tint[i],i?8:-8,0,W,H);});}
  out.globalCompositeOperation='source-over';out.globalAlpha=1;
  /* 2. scanlines: 1 px black every 3 px at 28% */
  if(FXS.scanlines){out.fillStyle='rgba(0,0,0,.28)';for(let y=2;y<H;y+=3)out.fillRect(0,y,W,1);}
  /* 3. vignette: clear centre to 62% black corners */
  if(FXS.vignette){const v=out.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,Math.hypot(W,H)/2);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.62)');out.fillStyle=v;out.fillRect(0,0,W,H);}}
/* THE NAN II THEME on the title screen: start the sound as the page opens. NAN II's screen
   lets a page play without a tap; an ordinary browser waits for the first key. */
audio();
requestAnimationFrame(frame);
</script>
